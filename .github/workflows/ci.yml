name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node scripts/generate-samples.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Demo (debe fallar: los ejemplos tienen fugas sembradas)
        run: |
          if npm run demo; then echo "La demo debía fallar" && exit 1; fi

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - name: LeakLens sobre la prueba E2E (debe encontrar las fugas sembradas)
        run: |
          if node dist/cli/index.js scan --config examples/playwright/leaklens.config.json; then echo "Debía encontrar fugas" && exit 1; fi
